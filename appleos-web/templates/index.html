<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AppleOS</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./assets/icons/apple-logo-128.png" />
  <link rel="stylesheet" href="./assets/css/appleos.css" />
</head>
<body>
  <canvas id="appleos-effects" aria-hidden="true"></canvas>
  <main class="boot-shell" aria-labelledby="appleos-title">
    <section class="boot-card">
      <div class="brand-row">
        <img class="brand-logo" src="./assets/icons/apple-logo-128.png" alt="" />
        <div>
          <p class="eyebrow">APPLEOS WEB</p>
          <h1 id="appleos-title">Choose your interface</h1>
        </div>
      </div>
      <p class="intro">Desktop loads the real ThanasOS build. Mobile loads the real PearisticOS file. Neither one is embedded into this page.</p>

      <div class="mode-grid" role="group" aria-label="AppleOS mode">
        <button class="mode-card" data-target="./desktop/index.html" data-mode="desktop">
          <span class="mode-glyph" aria-hidden="true">▣</span>
          <span class="mode-copy">
            <strong>Desktop</strong>
            <small>ThanasOS windows, Dock, Control Center, Launchpad and apps.</small>
          </span>
          <span class="mode-arrow" aria-hidden="true">→</span>
        </button>

        <button class="mode-card" data-target="./mobile/index.html" data-mode="mobile">
          <span class="mode-glyph phone" aria-hidden="true">▯</span>
          <span class="mode-copy">
            <strong>Mobile</strong>
            <small>Your PearisticOS build loaded as its own web resource.</small>
          </span>
          <span class="mode-arrow" aria-hidden="true">→</span>
        </button>
      </div>

      <div class="capabilities" aria-label="Runtime capabilities">
        <span id="pwa-status" class="capability">PWA</span>
        <span id="wasm-status" class="capability">WASM fallback ready</span>
        <span id="gpu-status" class="capability">GPU checking…</span>
      </div>

      <button id="install-button" class="install-button" hidden>Install AppleOS</button>
      <p id="fullscreen-note" class="note" hidden>Browser fullscreen was blocked. F11 still works.</p>
    </section>
  </main>

  <script type="module" src="./assets/js/app-shell.js"></script>
</body>
</html>
